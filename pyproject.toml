[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "homework-ocr"
version = "0.2.0"
description = "本地离线的学生手写作答提取工具（模板驱动 + RapidOCR/ONNXRuntime）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "PyMuPDF>=1.24",
    "opencv-python>=4.9",
    "numpy>=1.24",
    "Pillow>=10.0",
    "PyYAML>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
# 默认 OCR 后端。纯 CPU，Windows/macOS/Linux 通用。
rapid = ["rapidocr>=3.9", "onnxruntime>=1.18"]
# 备选后端。注意 macOS 兼容限制，见 README。
paddle = ["paddleocr>=3.0", "paddlepaddle>=3.0"]

[project.scripts]
homework-ocr = "homework_ocr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
homework_ocr = ["py.typed"]
